spring:
  application:
    name: media-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:4002/db_media
    username: postgres
    password: 123
  jpa:
    hibernate:
      ddl-auto: create-drop
      show-sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB

storage:
  client-path: /storage/**
  server-path: D:/PERSONAL_LEARNING/media-storage/
  base-uri: http://localhost:8080/storage/



